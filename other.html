<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTHER</title>
  <script>
    (function () {
      var baseEl = document.querySelector('base[data-auto-base]');
      if (!baseEl) {
        var href = window.location.href.split('#')[0].split('?')[0];
        if (!href.endsWith('/')) {
          if (href.includes('.')) {
            href = href.replace(/[^/]*$/, '');
          } else {
            href += '/';
          }
        }
        baseEl = document.createElement('base');
        baseEl.setAttribute('data-auto-base', 'true');
        baseEl.href = href;
        document.head.appendChild(baseEl);
      }

      var applyNormalizedSources = function () {
        var nodes = document.querySelectorAll('[data-normalize-src]');
        nodes.forEach(function (node) {
          var raw = node.getAttribute('data-normalize-src');
          if (typeof raw !== 'string' || !raw) return;
          var normalized = typeof raw.normalize === 'function' ? raw.normalize('NFC') : raw;
          if (node.getAttribute('src') !== normalized) {
            node.setAttribute('src', normalized);
          }
        });
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyNormalizedSources, { once: true });
      } else {
        applyNormalizedSources();
      }
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiA.woff2" as="font" type="font/woff2" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="device-detect.js?v=6"></script>
</head>
