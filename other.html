<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OTHER</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230a0a0a%22/><text x=%2250%22 y=%2268%22 font-family=%22sans-serif%22 font-size=%2255%22 font-weight=%22bold%22 fill=%22%23ffffff%22 text-anchor=%22middle%22>T</text></svg>">
  <script>
    (function () {
      var baseEl = document.querySelector('base[data-auto-base]');
      if (!baseEl) {
        var href = window.location.href.split('#')[0].split('?')[0];
        if (!href.endsWith('/')) {
          if (href.includes('.')) {
            href = href.replace(/[^/]*$/, '');
          } else {
            href += '/';
          }
        }
        baseEl = document.createElement('base');
        baseEl.setAttribute('data-auto-base', 'true');
        baseEl.href = href;
        document.head.appendChild(baseEl);
      }

      var applyNormalizedSources = function () {
        var nodes = document.querySelectorAll('[data-normalize-src]');
        nodes.forEach(function (node) {
          var raw = node.getAttribute('data-normalize-src');
          if (typeof raw !== 'string' || !raw) return;
          var normalized = typeof raw.normalize === 'function' ? raw.normalize('NFC') : raw;
          if (node.getAttribute('src') !== normalized) {
            node.setAttribute('src', normalized);
          }
        });
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyNormalizedSources, { once: true });
      } else {
        applyNormalizedSources();
      }
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=125">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body class="floating-world-page">
  <header class="main-header">
    <div class="header-item"><a href="index.html#other" style="text-decoration: none; color: inherit;">BACK</a></div>
  </header>


  <div id="app" data-page="floating-world">
    <main id="main" class="floating-main">
      <div class="scroll-guide">
        <svg viewBox="0 0 24 24">
            <path d="M7.41,15.41L12,10.83l4.59,4.58L18,14l-6-6l-6,6L7.41,15.41Z" />
        </svg>
      </div>
      <section class="floating-stage">
        <div class="floating-scene">
          <canvas id="floating-canvas"></canvas>
        </div>
        <div class="floating-scroll-spacer"></div>
      </section>

      <div class="ending-card">

      </div>
    </main>
  </div>

  <div class="floating-lightbox" id="floating-lightbox" aria-hidden="true">
    <div class="floating-lightbox__backdrop" data-lightbox-close></div>
    <div class="floating-lightbox__inner" role="dialog" aria-modal="true">
      <button type="button" class="floating-lightbox__close" data-lightbox-close aria-label="閉じる">×</button>
      <div class="floating-lightbox__content">
        <img src="" alt="" class="floating-lightbox__image">
      </div>
    </div>
  </div>
