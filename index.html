<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<title>CENOTAPH for — PORTFOLIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Dela+Gothic+One&family=Montserrat:wght@900&family=Syne:wght@800;900&family=Unbounded:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hero-v13.css?v=25">
<link rel="stylesheet" href="scene.css?v=33">
</head>
<body>
<main class="stage" id="stage" data-state="hero" aria-label="Portfolio">

  <!-- 背景レイヤー（HERO実写映像 → ロビー連番 → フロア静止画 → 各階ドリー動画 → 場面転換ディップ） -->
  <div class="layer layer--hero" id="heroLayer">
    <video id="heroVideo" muted playsinline loop autoplay poster="assets/scenes/hero_start.webp" aria-hidden="true">
      <source src="assets/video/hero_entrance.mp4" type="video/mp4">
    </video>
    <div class="heroOverlay" aria-hidden="true"></div>
  </div>
  <div class="layer layer--seq" id="seqLayer"><canvas id="seq" aria-hidden="true"></canvas><i class="seqScrim" aria-hidden="true"></i></div>
  <div class="layer layer--plate" id="plate"><img id="plateImg" alt="" decoding="async"></div>
  <div class="layer layer--video" id="dollyLayer"><video id="dolly" muted playsinline preload="none" disablepictureinpicture aria-hidden="true"></video></div>
  <div class="layer layer--dip" id="dip"></div>

  <!-- UIオーバーレイ -->
  <div class="lab" id="lab" data-stage="0">
    <header class="lab__header">
      <a class="lab__brand" href="#top" id="brand">PORTFOLIO</a>
    </header>
    
    <!-- 映画風メインタイトル: CENOTAPH for （Archivo Black・白縁連結・Nスパイク排除） -->
    <div class="cenotaph" id="cenotaph" aria-label="CENOTAPH for">
      <h1 class="cenotaph__title" aria-label="CENOTAPH">
        <svg class="cenotaph__svg" viewBox="0 0 1100 180" role="img" aria-hidden="true">
          <text x="50%" y="135" text-anchor="middle" class="cenotaph__svg-text">CENOTAPH</text>
        </svg>
      </h1>
      <span class="cenotaph__for">for</span>
    </div>

    <!-- 画面最下段のスクロール促進キュー -->
    <div class="scrollCue" id="scrollCue" aria-hidden="true">
      <span>SCROLL</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10l5 5 5-5"/></svg>
    </div>

    <!-- フロア選択レール（右側: 1F〜5F + 最下層 B1F） -->
    <nav class="lab__rail" id="rail" aria-label="研究所の各階">
      <button type="button" class="rail__btn rail__btn--1f" data-stage-jump="1"><span>1F</span><b>ABOUT</b></button>
      <button type="button" class="rail__btn rail__btn--2f" data-stage-jump="2"><span>2F</span><b>PRESENTATION</b></button>
      <button type="button" class="rail__btn rail__btn--3f" data-stage-jump="3"><span>3F</span><b>LP</b></button>
      <button type="button" class="rail__btn rail__btn--4f" data-stage-jump="4"><span>4F</span><b>WEB</b></button>
      <button type="button" class="rail__btn rail__btn--5f" data-stage-jump="5"><span>5F</span><b>DIRECTION</b></button>
      <button type="button" class="rail__btn rail__btn--b1f" data-stage-jump="6"><span>B1F</span><b>OTHER</b></button>
    </nav>

    <!-- B1F 暗号式アクセス認証モーダル -->
    <div class="cipherModal" id="cipherModal" hidden aria-modal="true" role="dialog">
      <div class="cipherBox">
        <div class="cipherBadge">SECURITY ACCESS CLEARANCE</div>
        <h3 class="cipherTitle">B1F RESTRICTED ARCHIVE</h3>
        <p class="cipherDesc">最下層アーカイブへのアクセスには合言葉（パスコード）が必要です。</p>
        <form class="cipherForm" id="cipherForm" onsubmit="return false;">
          <input type="text" class="cipherInput" id="cipherInput" placeholder="合言葉を入力 (例: CENOTAPH)" autocomplete="off" spellcheck="false">
          <div class="cipherActions">
            <button type="submit" class="cipherBtn cipherBtn--submit" id="cipherSubmit">認証実行</button>
            <button type="button" class="cipherBtn cipherBtn--bypass" id="cipherBypass">即時解錠 (BYPASS)</button>
            <button type="button" class="cipherBtn cipherBtn--cancel" id="cipherCancel">閉じる</button>
          </div>
        </form>
        <div class="cipherHint">HINT: 最上層のモニュメント名（合言葉: <code>CENOTAPH</code>）</div>
      </div>
    </div>

    <!-- 各階ポータル（作品リンク） -->
    <aside class="lab__portal" id="portal" aria-hidden="true">
      <h2 id="portalTitle">ABOUT</h2>
      <a id="portalLink" href="about.html" tabindex="-1">OPEN PAGE</a>
    </aside>

    <!-- コンタクトモーダル -->
    <div class="contactLayer" id="contactLayer" hidden>
      <button class="contactClose" type="button" data-contact-close>CLOSE</button>
      <div class="contactInner">
        <img class="portrait" src="image/teshima_takashi_portrait.png" alt="TESHIMA TAKASHI">
        <p>TESHIMA TAKASHI</p>
        <a href="mailto:vadbusting@gmail.com">vadbusting@gmail.com</a>
        <img class="qr" src="image/portfolio_qr.png" alt="Portfolio QR Code">
      </div>
    </div>
  </div>
</main>
<script src="scene.js?v=26"></script>
</body>
</html>
