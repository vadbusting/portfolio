<!DOCTYPE html>
<html>
<head>
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
        fetch('/log?msg=' + encodeURIComponent(msg + ' at line ' + lineNo));
    };
    window.addEventListener('unhandledrejection', function(event) {
        fetch('/log?msg=' + encodeURIComponent('Unhandled Rejection: ' + event.reason));
    });
  </script>
</head>
<body>
  <script>
    fetch('/log?msg=test_start');
  </script>
</body>
</html>
